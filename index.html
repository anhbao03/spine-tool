<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spine Inspector</title>
    <style>
      :root { --bg: #1b1b1b; --panel: #222; --line: #333; --text: #ddd; --dim: #888; --accent: #00b8d4; --err: #ff6b6b; --warn: #f4b942; }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      button, select, input { font: inherit; color: inherit; background: #2d2d2d; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .4; }
      .app { display: grid; grid-template: auto auto 1fr auto / var(--left, 280px) minmax(0, 1fr) var(--right, 340px); height: 100%; }
      header { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      header .title { font-weight: 600; margin-right: auto; }
      .msgs { grid-column: 1 / -1; }
      .msg { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border-bottom: 1px solid var(--line); }
      .msg.err { color: var(--err); } .msg.warn { color: var(--warn); }
      .msg span { flex: 1; white-space: pre-wrap; }
      .tree, .inspector { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); grid-row: 3; }
      .inspector { border-right: 0; border-left: 1px solid var(--line); grid-column: 3; padding: 8px 10px; }
      .search { position: sticky; top: 0; z-index: 1; width: 100%; border-radius: 0; border-width: 0 0 1px; padding: 6px 10px; background: var(--panel); }
      .pad { padding: 10px; margin: 0; }
      mark { background: #f4b94255; color: inherit; border-radius: 2px; }
      .overlays { position: absolute !important; inset: 8px auto auto 8px !important; display: grid; gap: 2px; padding: 6px 10px; margin: 0; border: 1px solid var(--line); border-radius: 4px; background: #222d; }
      .overlays legend { color: var(--dim); font-size: 11px; padding: 0 4px; }
      .overlays label { white-space: nowrap; }
      details { border-bottom: 1px solid var(--line); padding: 6px 0; }
      summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
      details > :not(summary):first-of-type { margin-top: 6px; }
      .monitor tr { cursor: default; } .monitor tr.on td { background: #0b4f5c; }
      .monitor td { padding: 1px 4px; border-bottom: 1px solid #2a2a2a; }
      .diff { color: var(--warn); }
      .small { font-size: 12px; margin: 0 0 6px; }
      .row { display: flex; align-items: center; gap: 4px; width: 100%; border: 0; border-radius: 0; background: none; padding: 1px 6px; text-align: left; white-space: nowrap; }
      .row.on { background: #0b4f5c; }
      .caret { width: 14px; color: var(--dim); flex: none; }
      .kind { font-size: 10px; width: 14px; text-align: center; border-radius: 3px; flex: none; color: #111; }
      .k-bone { background: #8ab4f8; } .k-slot { background: #81c995; } .k-attachment { background: #f6aea9; }
      .tree { grid-column: 1; } .stage { grid-column: 2; grid-row: 3; position: relative; min-height: 0; } .bar { grid-column: 1 / -1; grid-row: 4; }
      .stage > div { position: absolute; inset: 0; }
      .drop { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; text-align: center; }
      .bar { padding: 6px 10px; border-top: 1px solid var(--line); background: var(--panel); }
      .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
      .controls > * { white-space: nowrap; flex: none; }
      .chip { border: 1px solid var(--line); border-radius: 4px; padding: 1px 2px 1px 8px; }
      .chip.on { border-color: var(--accent); background: #0b4f5c; }
      .chip button { border: 0; background: none; padding: 0 6px; }
      .frameinfo { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
      .ruler { position: relative; height: 40px; margin: 0 8px; border-bottom: 1px solid var(--line); }
      .ruler i { position: absolute; bottom: 0; width: 1px; pointer-events: none; }
      .tick { height: 6px; background: #555; } .tick.major { height: 12px; background: #999; }
      .tick span { position: absolute; bottom: 13px; transform: translateX(-50%); font: 10px/1 system-ui; color: var(--dim); font-style: normal; }
      .ruler .keymark { top: 3px; bottom: auto; height: 6px; width: 3px; margin-left: -1px; background: var(--warn); border-radius: 1px; }
      .ruler .head { top: 0; width: 2px; margin-left: -1px; background: var(--accent); }
      .ruler input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; -webkit-appearance: none; appearance: none; cursor: ew-resize; }
      .ruler input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 1px; height: 40px; }
      .ruler input[type=range]::-moz-range-thumb { width: 1px; height: 40px; border: 0; }
      .ruler:has(input:focus-visible) { outline: 1px solid var(--accent); }
      .lane { position: relative; height: 20px; margin: 0 8px; }
      .evmark { position: absolute; top: 2px; transform: translateX(-50%); font-size: 10px; padding: 0 4px; color: #111; background: var(--warn); border: 0; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .time { font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
      h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 12px 0 4px; }
      h3:first-child { margin-top: 0; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 1px 0; vertical-align: top; } td:first-child { color: var(--dim); width: 45%; }
      td:last-child { font-variant-numeric: tabular-nums; word-break: break-all; }
      .swatch { display: inline-block; width: 10px; height: 10px; border: 1px solid #555; margin-right: 4px; vertical-align: middle; }
      .muted { color: var(--dim); }
      .resizer { grid-column: 2; grid-row: 3; width: 6px; margin: 0 -3px; z-index: 2; cursor: col-resize; }
      .resizer:hover, .resizer:focus-visible, .resizer:active { background: var(--accent); outline: 0; }
      .resizer.l { justify-self: start; } .resizer.r { justify-self: end; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
